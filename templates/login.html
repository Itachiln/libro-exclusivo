<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acceso al Libro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --negro:#141414; --rojo:#e50914; }
    body {
      margin:0; background:var(--negro); color:#fff;
      font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
      min-height:100vh; display:flex; align-items:center; justify-content:center;
    }
    .contenedor {
      width:90%; max-width:420px; background:#1a1a1a; border-radius:12px; padding:28px;
      box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.04);
      position:relative; overflow:hidden;
    }
    h1 { margin:0 0 16px; color:var(--rojo); font-weight:800; letter-spacing:.5px; }
    p { color:#ccc; margin:0 0 22px; }
    input {
      width:100%; padding:12px 14px; margin:10px 0; border:none; border-radius:8px;
      background:#262626; color:#fff; outline:none;
    }
    input::placeholder { color:#888; }
    button {
      width:100%; background:var(--rojo); color:#fff; border:none; border-radius:8px;
      padding:12px 14px; cursor:pointer; font-weight:700; letter-spacing:.3px;
    }
    button:hover { filter:brightness(1.1); }
    .decor {
      position:absolute; border-radius:50%; background:rgba(229,9,20,.16);
      animation:flotar 9s infinite alternate ease-in-out;
    }
    .d1 { width:120px; height:120px; top:-40px; right:-40px; }
    .d2 { width:80px; height:80px; bottom:-30px; left:-30px; animation-duration:12s; }
    @keyframes flotar {
      from { transform:translateY(0) translateX(0); }
      to   { transform:translateY(-18px) translateX(14px); }
    }
    .pie { margin-top:14px; text-align:center; color:#777; font-size:.9rem; }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="decor d1"></div>
    <div class="decor d2"></div>
    <h1>Acceso exclusivo</h1>
    <p>Entra para leer el libro.</p>
    <form method="POST">
      <input type="text" name="user" placeholder="Usuario" required>
      <input type="password" name="password" placeholder="Contraseña" required>
      <button type="submit">Entrar</button>
    </form>
    <div class="pie">Estilo elegante inspirado en Netflix</div>
  </div>
</body>
</html>
